[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ragkb"
version = "0.1.0"
description = "企业知识库问答（RAG）参考实现：混合检索 + 引用溯源 + 评测门禁 + 可观测性，核心零第三方依赖"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["rag", "retrieval-augmented-generation", "bm25", "hybrid-search", "llm", "knowledge-base"]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Intended Audience :: Developers",
]

# 核心运行时**不依赖任何第三方包**：只用标准库（sqlite3 / http.server / urllib）。
# 这是刻意的工程选择，详见 README「为什么零依赖」。
dependencies = []

[project.optional-dependencies]
# 文档解析扩展（缺哪个就少支持哪种格式，入库报告会说明）
parse = ["python-docx>=1.1", "openpyxl>=3.1", "pypdf>=4.0"]
# 向量检索加速（没有也能跑，纯 Python 回退）
speed = ["numpy>=1.26"]
# 本地**语义** embedding：ONNX Runtime + BGE，约 23MB，不需要 torch。
# 模型用 scripts/fetch_model.py 下载（Xenova 的 ONNX 导出）。
# 版本上限是实测结论：1.19.2 在 Anaconda 版 Python 3.11 上正常，1.30.0 加载原生模块时
# 崩溃（访问冲突）；干净 CPython 环境可以放宽到最新版。
local-models = ["onnxruntime>=1.19.2,<1.20", "tokenizers>=0.15"]
# 需要 torch 的方案（体积 ~2.5GB，仅在你已有 GPU/已装 torch 时考虑）
sentence-transformers = ["sentence-transformers>=2.5"]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
ragkb = "ragkb.cli:main"

[project.urls]
Documentation = "https://github.com/your-name/rag-kb#readme"
Source = "https://github.com/your-name/rag-kb"

[tool.setuptools]
packages = ["ragkb"]

[tool.setuptools.package-data]
ragkb = ["static/*.html", "py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["data", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501", "SIM108", "B008"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true
files = ["ragkb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
